name: build

on:
  push:
    branches:
    - main

env:
  VERSION: v11.3.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Download CyberChef source code
      run: |
        wget https://github.com/gchq/CyberChef/archive/refs/tags/${{ env.VERSION }}.tar.gz
        tar -xzf ${{ env.VERSION }}.tar.gz --strip-components=1

    - name: Apply patches
      run: git apply *.patch

    - name: Set node version
      uses: actions/setup-node@v6
      with:
        node-version: '24.x'
        registry-url: 'https://registry.npmjs.org'

    - name: Install
      run: |
        export DETECT_CHROMEDRIVER_VERSION=true
        npm install
        npm run setheapsize

    - name: Lint
      run: npx grunt lint

    - name: Production Build
      if: success()
      run: npx grunt prod --msg="This instance of CyberChef respects your privacy and has all analytics code removed. The source code for patches is available <a href='https://codeberg.org/pashynskykh/librechef'>here</a>."

    - name: Generate sitemap
      run: npx grunt exec:sitemap

    - name: Prepare for GitHub Pages
      if: success()
      run: npx grunt copy:ghPages

    - name: Upload static files as artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: ./build/prod

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v5
